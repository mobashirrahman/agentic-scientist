<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgenticScientist Monitor</title>
<style>
  :root {
    --bg: #0c0e14; --card: #13161f; --hover: #1a1e2a; --border: #1e2333;
    --fg: #c8cdd8; --dim: #7b8394; --bright: #e8ecf4; --accent: #6d9cff;
    --green: #4ade80; --red: #f87171; --amber: #fbbf24; --violet: #c084fc; --code: #0a0c12;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --grid: #232838;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8; --card: #fff; --hover: #f0f1f4; --border: #dde0e7;
      --fg: #374151; --dim: #6b7280; --bright: #111827; --accent: #3b6fd9;
      --green: #16a34a; --red: #dc2626; --amber: #d97706; --violet: #9333ea; --code: #f0f1f4;
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #e6e8ee;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8; --card: #fff; --hover: #f0f1f4; --border: #dde0e7;
    --fg: #374151; --dim: #6b7280; --bright: #111827; --accent: #3b6fd9;
    --green: #16a34a; --red: #dc2626; --amber: #d97706; --violet: #9333ea; --code: #f0f1f4;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #e6e8ee;
    color-scheme: light;
  }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .sw.hollow { background: transparent !important; border: 2px solid currentColor; width: 10px; height: 10px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg); margin-bottom: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .mini h3 { font-size: 12px; font-weight: 600; color: var(--bright); margin-bottom: 4px; }
  .mini .sub { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  #tip { position: fixed; z-index: 30; pointer-events: none; background: var(--card); color: var(--fg); border: 1px solid var(--border);
         border-radius: 8px; padding: 6px 10px; font-size: 12px; max-width: 340px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .ci { position: relative; height: 8px; width: 120px; background: var(--hover); border-radius: 4px; display: inline-block; vertical-align: middle; margin-left: 8px; }
  .ci i { position: absolute; top: 3px; height: 2px; background: var(--fg); }
  .ci b { position: absolute; top: 0; width: 8px; height: 8px; border-radius: 50%; margin-left: -4px; }
  .gapbar { height: 8px; border-radius: 0 4px 4px 0; background: var(--accent); display: inline-block; vertical-align: middle; }
  .cd .v { font-size: 20px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono, code, pre { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
  a { color: var(--accent); }
  .layout { display: flex; min-height: 100vh; }
  nav { width: 210px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 20px 12px;
        position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
  nav h1 { font-family: ui-monospace, Menlo, monospace; font-size: 15px; color: var(--accent);
           margin: 0 8px 16px; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
  nav button { background: none; border: 0; color: var(--dim); font: inherit; padding: 7px 12px;
               border-radius: 6px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; }
  nav button:hover { background: var(--card); color: var(--fg); }
  nav button.active { background: var(--card); color: var(--accent); font-weight: 600; }
  nav .badge { font-size: 11px; color: var(--dim); }
  .foot { margin-top: auto; font-size: 11px; color: var(--dim); padding: 0 8px; display: grid; gap: 6px; }
  .foot select, .foot button, .ctl { font: inherit; font-size: 12px; background: var(--card); color: var(--fg);
        border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; cursor: pointer; }
  .foot select, .foot button { width: 100%; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); display: inline-block; flex-shrink: 0; }
  .dot.alive { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  .dot.dead { background: var(--red); }
  @keyframes pulse { 50% { opacity: .45; } }
  main { flex: 1; min-width: 0; padding: 22px 28px 60px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px;
       display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  section.block { margin-bottom: 26px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .stat, .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .stat .l { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 22px; font-weight: 600; color: var(--bright); font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 12px; color: var(--dim); }
  .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .bar { height: 6px; background: var(--hover); border-radius: 3px; margin-top: 8px; overflow: hidden; position: relative; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar b { position: absolute; top: -2px; width: 2px; height: 10px; background: var(--amber); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; font-size: 13px; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; background: var(--card); }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--hover); }
  .wrap { overflow-x: auto; }
  .alerts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .alert { border-radius: 8px; padding: 7px 12px; font-size: 13px; border: 1px solid var(--border); background: var(--card); }
  .alert.error { border-color: var(--red); color: var(--red); } .alert.warn { border-color: var(--amber); color: var(--amber); }
  .alert.info { color: var(--dim); }
  .progress { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 6px 0 2px; }
  .progress i { display: block; height: 100%; background: var(--green); }
  .gate { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .gate.open { background: var(--green); } .gate.shut { background: var(--red); }
  .lineage td:first-child { white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); white-space: nowrap; }
  .accepted, .go, .pass, .ok { color: var(--green); border-color: var(--green); }
  .rejected, .reject, .vetoed, .disqualified, .fix, .bad { color: var(--red); border-color: var(--red); }
  .revise, .skipped, .warn { color: var(--amber); border-color: var(--amber); }
  .running { color: var(--accent); border-color: var(--accent); }
  .pos { color: var(--green); } .neg { color: var(--red); } .dim { color: var(--dim); }
  pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto;
        font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; max-height: 70vh; }
  pre.nowrap { white-space: pre; }
  .diff .a { color: var(--green); } .diff .d { color: var(--red); } .diff .h { color: var(--accent); }
  .ev { border-left: 3px solid var(--border); padding: 4px 10px; margin: 4px 0; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .ev.say { border-color: var(--bright); color: var(--bright); }
  .ev.tool { border-color: var(--accent); } .ev.tool .n { color: var(--accent); font-weight: 600; }
  .ev.result { border-color: var(--border); color: var(--dim); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .ev.result.err { border-color: var(--red); color: var(--red); }
  .ev.think { border-color: var(--violet); color: var(--dim); font-style: italic; }
  .ev.done { border-color: var(--green); color: var(--green); font-size: 11.5px; }
  .ev.sys, .ev.raw { color: var(--dim); font-size: 11.5px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { background: var(--card); border: 1px solid var(--border); color: var(--dim); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; }
  .tabs button.active { color: var(--accent); border-color: var(--accent); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: flex-start; padding: 4vh 2vw; z-index: 10; }
  .modal .box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; width: min(1200px, 100%); max-height: 92vh; overflow: auto; padding: 20px 22px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--dim); }
  svg text { fill: var(--dim); font-size: 11px; }
  .pill { font-size: 11px; color: var(--dim); }
  input.ctl { cursor: text; min-width: 200px; }
  ul.ev-list { padding-left: 18px; } ul.ev-list li { margin: 3px 0; }
  .host { display: grid; gap: 4px; }
  @media (max-width: 760px) { .layout { display: block; } nav { position: static; width: auto; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); }
    .foot { margin: 0; width: 100%; } main { padding: 16px; } .grid2 { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="holdoutBanner" hidden style="position:sticky;top:0;z-index:20;background:#b45309;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center">
  <strong>🔒 Holdout passphrase needed</strong><span id="hbText"></span>
  <span style="flex:1"></span>
  <select id="hbRun"></select><select id="hbCfg"></select>
  <label style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="hbExport">export test bundle</label>
  <input type="password" id="hbPass" placeholder="passphrase" autocomplete="off" style="padding:4px 8px;border-radius:6px;border:0">
  <button id="hbGo" style="padding:4px 12px;border-radius:6px;border:0;cursor:pointer">Run holdout selection</button>
  <span id="hbMsg"></span>
</div>
<div class="layout">
<nav>
  <h1><span class="dot" id="dot"></span>agentic_scientist</h1>
  <button data-p="final">Final run <span class="badge" id="finalBadge"></span></button>
  <button data-p="overview" class="active">Overview <span class="badge" id="healthBadge"></span></button>
  <button data-p="tasks">Per task <span class="badge" id="taskBadge"></span></button>
  <button data-p="live">Live agents <span class="badge" id="liveBadge"></span></button>
  <button data-p="cycles">Cycles <span class="badge" id="cycBadge"></span></button>
  <button data-p="tuning">Knob tuning <span class="badge" id="tuneBadge"></span></button>
  <button data-p="best">Best program</button>
  <button data-p="holdout">Holdout selection</button>
  <button data-p="notebook">Knowledge bank <span class="badge" id="kbBadge"></span></button>
  <button data-p="fleet">Fleet <span class="badge" id="fleetBadge"></span></button>
  <button data-p="activity">Repo activity</button>
  <button data-p="logs">Logs</button>
  <button data-p="limits">Rate limits <span class="badge" id="limBadge"></span></button>
  <button data-p="config">Config &amp; lock</button>
  <div class="foot">
    <select id="runSel" aria-label="run"></select>
    <label><select id="refresh" aria-label="refresh"><option value="5">refresh 5s</option><option value="10" selected>refresh 10s</option><option value="30">refresh 30s</option><option value="0">paused</option></select></label>
    <button id="themeBtn">theme</button>
    <span id="refreshInfo"></span>
    <a href="http://localhost:8477" target="_blank">Shinka monitor :8477</a>
  </div>
</nav>
<main>
  <div id="p-final" hidden></div>
  <div id="p-overview"></div>
  <div id="p-tasks" hidden></div>
  <div id="p-tuning" hidden></div>
  <div id="p-live" hidden></div>
  <div id="p-cycles" hidden></div>
  <div id="p-best" hidden></div>
  <div id="p-holdout" hidden></div>
  <div id="p-notebook" hidden></div>
  <div id="p-fleet" hidden></div>
  <div id="p-activity" hidden></div>
  <div id="p-logs" hidden></div>
  <div id="p-limits" hidden></div>
  <div id="p-config" hidden></div>
</main>
</div>
<div id="tip" hidden></div>
<div class="modal" id="modal" hidden><div class="box"><div class="row" style="justify-content:space-between;margin-bottom:10px">
  <h2 id="mTitle" style="margin:0">Cycle</h2><button class="ctl" id="mClose">close ✕</button></div>
  <div class="tabs" id="mTabs"></div><div id="mBody"></div></div></div>
<script>
const B = [['temporal','T1 · temporal',1],['heart','T2 · heart',.5],['embryo','T2 · embryo',.5],['perturbation','T3 · knockout',1]];
const $ = id => document.getElementById(id);
const f = (x, d=2) => x == null || isNaN(x) ? '–' : Number(x).toFixed(d);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t2 = b => b && b.heart != null && b.embryo != null ? (b.heart + b.embryo) / 2 : null;
const ago = t => { if (!t) return '–'; const s = Date.now()/1000 - t; return s < 60 ? Math.round(s)+'s ago' : s < 3600 ? Math.round(s/60)+'m ago' : (s/3600).toFixed(1)+'h ago'; };
const tag = (v, cls) => v ? `<span class="tag ${cls || v}">${esc(v)}</span>` : '';
const delta = (v, r) => v == null || r == null ? '' : `<span class="${v - r >= 0 ? 'pos' : 'neg'}"> ${v - r >= 0 ? '+' : ''}${f(v - r)}</span>`;
const store = { get: k => { try { return localStorage.getItem('mg.' + k) } catch (e) { return null } },
                set: (k, v) => { try { localStorage.setItem('mg.' + k, v) } catch (e) {} } };
let RUN = null, D = null, PAGE = store.get('page') || 'overview', timer = null, metric = store.get('metric') || 'proxy';
let LOGW = 'run', LOGF = '', FOLLOW = true, LIVEFOLLOW = true;
const api = async (p, q = {}) => { const u = new URLSearchParams({ name: RUN || '', ...q }); const r = await fetch(p + '?' + u); return r.ok ? r.json() : null; };

// ---------- theme ----------
function theme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; store.set('theme', t || ''); }
theme(store.get('theme') || '');
$('themeBtn').onclick = () => theme(({'': 'light', light: 'dark', dark: ''})[document.documentElement.dataset.theme || '']);

// ---------- navigation ----------
document.querySelectorAll('nav button[data-p]').forEach(b => b.onclick = () => show(b.dataset.p));
function show(p) { PAGE = p; store.set('page', p);
  document.querySelectorAll('nav button[data-p]').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  document.querySelectorAll('main > div').forEach(d => d.hidden = d.id !== 'p-' + p); render(); }

// ---------- chart (inline SVG) ----------
function chart(d) {
  const seed = d.seed || {}, val = c => metric === 'proxy' ? c.proxy : metric === 't2' ? t2(c.boards) : c.boards?.[metric];
  const base = metric === 'proxy' ? seed.proxy : metric === 't2' ? t2(seed.boards) : seed.boards?.[metric];
  const pts = d.cycles.filter(c => c.outcome && val(c) != null).sort((a, b) => a.updated - b.updated);
  const W = 900, H = 260, L = 46, R = 12, T = 12, Bm = 28;
  const ys = pts.map(val).concat(base != null ? [base] : []);
  if (!ys.length) return '<div class="dim">No evaluated cycles yet.</div>';
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = Math.max(.5, (hi - lo) * .15); lo -= pad; hi += pad;
  const X = i => L + (pts.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1)), Y = v => T + (hi - v) / (hi - lo) * (H - T - Bm);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="score per cycle">`;
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${f(v, 1)}</text>`; }
  if (base != null) s += `<line x1="${L}" x2="${W - R}" y1="${Y(base)}" y2="${Y(base)}" stroke="var(--amber)" stroke-dasharray="5 4"/><text x="${W - R}" y="${Y(base) - 5}" text-anchor="end" style="fill:var(--amber)">seed ${f(base)}</text>`;
  let best = base ?? -1e9, path = '';
  pts.forEach((c, i) => { if (c.outcome.verdict === 'accepted' && val(c) > best) best = val(c); path += `${i ? 'L' : 'M'}${X(i)},${Y(Math.max(best, lo))}`; });
  if (pts.length) s += `<path d="${path}" fill="none" stroke="var(--green)" stroke-width="2"/>`;
  pts.forEach((c, i) => { const col = c.outcome.verdict === 'accepted' ? 'var(--green)' : 'var(--red)';
    s += `<circle cx="${X(i)}" cy="${Y(val(c))}" r="5" fill="${col}" style="cursor:pointer" onclick="openCycle('${c.id}')"><title>${esc(c.id)} · ${esc(c.title)} · ${f(val(c))} (${c.outcome.verdict})</title></circle>`; });
  pts.forEach((c, i) => { if (pts.length < 25 || i % Math.ceil(pts.length / 12) === 0) s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(c.id)}</text>`; });
  return s + '</svg><div class="pill">dots = evaluated cycles (green accepted, red rejected; click to open) · green line = best accepted · dashed = seed</div>';
}

// ---------- pages ----------
function overview(d) {
  const seed = d.seed || {}, bestB = d.best?.boards || seed.boards || {};
  const done = d.cycles.filter(c => c.outcome).length, act = d.cycles.filter(c => c.active);
  const latest = d.cycles.filter(c => c.outcome).sort((a, b) => b.updated - a.updated)[0];
  const mopt = [['proxy','Proxy (T1+T3+½heart+½embryo)'],['temporal','T1'],['t2','T2 mean'],['heart','T2 heart'],['embryo','T2 embryo'],['perturbation','T3']];
  return `<div class="stats">
   <div class="stat"><div class="l">Status</div><div class="v">${d.alive ? '<span class="pos">running</span>' : d.final ? 'finished' : '<span class="dim">stopped</span>'}</div><div class="s">${d.alive && !d.seed ? 'Scoring the seed' : act.length ? 'now: ' + esc(act.map(a => a.id + ' · ' + a.current).join(', ')) : ''}</div></div>
   <div class="stat"><div class="l">Seed dev proxy</div><div class="v">${f(seed.proxy)}</div><div class="s">v2 human model</div></div>
   <div class="stat"><div class="l">Best dev proxy</div><div class="v">${f(d.global_best)}</div><div class="s">${delta(d.global_best, seed.proxy)} vs seed</div></div>
   <div class="stat"><div class="l">Cycles</div><div class="v">${done}<span class="dim">/${d.config ? d.config.workers * d.config.cycles_per_worker : '?'}</span></div><div class="s">${d.accepted.length} accepted · ${d.stale ?? 0} since new best</div></div>
   <div class="stat"><div class="l">Agent calls</div><div class="v">${d.calls ?? 0}<span class="dim">/${d.config?.max_agent_calls ?? '?'}</span></div><div class="s">Claude cost $${f(d.cost_usd)}</div></div>
   <div class="stat"><div class="l">Holdout pick</div><div class="v">${d.final ? esc(d.final.chosen) : '–'}</div><div class="s">${d.final ? 'holdout ' + f(d.final.candidates.find(c => c.id === d.final.chosen)?.holdout) : 'after the run'}</div></div>
  </div>
  <section class="block"><h2>Boards — best accepted program (${esc(d.best?.id || 'seed')}) vs seed</h2><div class="boards">
   ${[['T1 · temporal', bestB.temporal, seed.boards?.temporal, '×1'], ['T2 · mean', t2(bestB), t2(seed.boards), '×1'], ['T2 · heart', bestB.heart, seed.boards?.heart, '×½'],
      ['T2 · embryo', bestB.embryo, seed.boards?.embryo, '×½'], ['T3 · knockout', bestB.perturbation, seed.boards?.perturbation, '×1']].map(([n, v, r, w]) =>
     `<div class="card"><div class="stat"><div class="l">${n} <span class="dim">${w}</span></div></div><div class="v" style="font-size:20px;font-weight:600;color:var(--bright)">${f(v)}${delta(v, r)}</div>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, v || 0))}%"></i><b style="left:50%" title="copy floor 50"></b></div><div class="pill">50 = copy floor · 100 = ceiling</div></div>`).join('')}
  </div></section>
  <section class="block"><h2>Score per cycle <select class="ctl" id="metricSel">${mopt.map(([k, n]) => `<option value="${k}" ${k === metric ? 'selected' : ''}>${n}</option>`).join('')}</select></h2><div class="card">${chart(d)}</div></section>
  <div class="grid2">

function lineDiff(a, b) { // tiny LCS line diff for the curator's rewrite
  const x = (a || '').split('\n'), y = (b || '').split('\n'), n = x.length, m = y.length;
  if (n * m > 4e6) return y.map(l => '+' + l).join('\n');
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (x[i] === y[j]) { out.push(' ' + x[i]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push('-' + x[i++]); else out.push('+' + y[j++]); }
  while (i < n) out.push('-' + x[i++]); while (j < m) out.push('+' + y[j++]); return out.join('\n');
}

function convChart(tr) {

  const W = 520, H = 150, L = 40, R = 8, T = 8, Bm = 20, ys = pts.map(t => t.score);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = Math.max(.2, (hi - lo) * .1); lo -= pad; hi += pad;
  const X = i => L + i * (W - L - R) / Math.max(1, tr.length - 1), Y = v => T + (hi - v) / (hi - lo) * (H - T - Bm);
  const cols = ['var(--dim)', 'var(--violet)', 'var(--green)', 'var(--amber)', 'var(--red)'];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:560px">`, best = -1e9, path = '';
  for (let k = 0; k <= 2; k++) { const v = lo + (hi - lo) * k / 2; s += `<text x="${L - 5}" y="${Y(v) + 4}" text-anchor="end">${f(v, 1)}</text><line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)"/>`; }
  tr.forEach((t, i) => { if (t.score != null) { best = Math.max(best, t.score); s += `<circle cx="${X(i)}" cy="${Y(t.score)}" r="3" fill="${cols[(t.round ?? 0) % cols.length]}"><title>trial ${t.trial} round ${t.round ?? '?'}: ${f(t.score)} ${esc(JSON.stringify(t.params))}</title></circle>`; }
    if (best > -1e9) path += `${path ? 'L' : 'M'}${X(i)},${Y(best)}`; });
  return s + `<path d="${path}" fill="none" stroke="var(--green)" stroke-width="1.5"/></svg><div class="pill">dots = settings by round (grey Sobol start, then GP batches) · line = best so far · search seed pair only</div>`;
}

function mini(pts, ref, step, nx) { // pts: [{x, y, col, filled, tip}]; ref: seed level; step: running best [[x,y]]; nx: cycles on the axis
  const W = 440, H = 190, L = 38, R = 10, T = 10, Bm = 22;

  const n = Math.max(nx || 0, ...pts.map(p => p.x + 1)), X = x => L + (W - L - R) * (n <= 1 ? .5 : x / (n - 1)), Y = y => T + (H - T - Bm) * (1 - (y - lo) / (hi - lo));
  const ticks = [0, .5, 1].map(q => lo + (hi - lo) * q);

  g += `<text x="${L}" y="${H - 6}">cycle 1</text><text x="${W - R}" y="${H - 6}" text-anchor="end">cycle ${n}</text>`;
  if (ref != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--dim)" stroke-dasharray="4 4"/><text x="${L + 4}" y="${Y(ref) - 4}">seed ${f(ref, 1)}</text>`;
  if (step && step.length > 1) g += `<path d="${step.map((s, i) => (i ? `H${X(s[0])}V${Y(s[1])}` : `M${X(s[0])},${Y(s[1])}`)).join('')}" fill="none" stroke="var(--fg)" stroke-width="2" opacity=".55"/>`;

  const alerts = F.alerts.length ? `<div class="alerts">${F.alerts.map(a => `<div class="alert ${a.level}">${a.level === 'error' ? '✖' : '⚠'} ${esc(a.msg)}</div>`).join('')}</div>` : '';
  const brow = B.map(([b, name, w]) => { const x = F.boards[b] || {}, g = F.gaps[LBB[b]] || {};
    return `<tr><td><b>${name}</b> <span class="dim">×${w}</span></td><td>${x.accepted ?? 0} / ${x.cycles ?? 0}</td>
      <td>${f(x.seed_dev)} → ${f(x.best_dev ?? x.seed_dev)} ${x.best_dev != null ? sgn(x.best_dev - x.seed_dev) : ''}</td>
      <td>${x.seed_hold == null ? '<span class="dim">no local target</span>' : `${f(x.seed_hold)} → ${f(x.best_acc_hold ?? x.seed_hold)} ${x.best_acc_hold != null ? sgn(x.best_acc_hold - x.seed_hold) : ''}`}</td>
      <td>${f(g.ours)} <span class="dim">(${esc(g.ours_entry || '')})</span></td><td>${f(g.top10)}</td><td>${f(g.leader)}</td></tr>`; }).join('');
  const boards = `<section class="block"><h2>Boards: dev score agents see · private held-out (humans only) · public test</h2><div class="card wrap"><table>
     <tr><th>Board</th><th>Accepted / cycles</th><th>Dev: seed → best accepted</th><th>Private held-out: seed → best accepted</th><th>Our best test entry</th><th>Public top-10</th><th>Leader</th></tr>${brow}</table></div></section>`;
  const models = [...new Set(F.cycles.map(c => c.researcher).filter(Boolean))];
  const legend = `<div class="legend">${models.map(m => `<span><span class="sw" style="background:${mcol(m)}"></span>${esc(mname(m))}</span>`).join('')}
     <span><span class="sw" style="background:var(--fg)"></span>accepted</span><span style="color:var(--fg)"><span class="sw hollow"></span>not accepted</span>
     <span class="dim">line: current parent (best accepted) · dashed: seed</span></div>`;
  const devCharts = B.map(([b, name]) => { const cs = F.cycles.filter(c => c.board === b && c.dev != null); let best = F.boards[b]?.seed_dev, step = [];
    const pts = cs.map((c, i) => { if (c.verdict === 'accepted' && (best == null || c.dev > best)) best = c.dev; step.push([i, best]);
      return { x: i, y: c.dev, col: mcol(c.researcher), filled: c.verdict === 'accepted',
        tip: `<b>${esc(c.id)}</b> · ${esc(c.verdict)}<br>${esc(mname(c.researcher))}${c.substitute ? ' (for ' + esc(mname(c.intended)) + ')' : ''}<br>dev ${f(c.dev)} (${c.parent_dev != null ? (c.dev - c.parent_dev >= 0 ? '+' : '') + f(c.dev - c.parent_dev) : '–'} vs parent) · ${f(c.minutes, 0)} min<br><span class="dim">${esc((c.title || '').slice(0, 140))}</span>` }; });
    return `<div class="card mini"><h3>${name}</h3><div class="sub">dev board score per cycle</div>${mini(pts, F.boards[b]?.seed_dev, step)}</div>`; }).join('');
  const holdCharts = ['temporal', 'heart', 'embryo', 'perturbation'].map(b => { const name = B.find(x => x[0] === b)[1];
    const idx = Object.fromEntries(F.cycles.filter(c => c.board === b && c.dev != null).map((c, i) => [c.id, i]));
    const hs = F.holdout.filter(h => h.board === b && h.id in idx);
    const pts = hs.map(h => ({ x: idx[h.id], y: h.score, col: mcol(h.researcher), filled: h.verdict === 'accepted',
      tip: `<b>${esc(h.id)}</b> · ${esc(h.verdict)}<br>${esc(mname(h.researcher))}<br>held-out ${f(h.score)} (${h.parent_score != null ? (h.score - h.parent_score >= 0 ? '+' : '') + f(h.score - h.parent_score) : '–'} vs parent)` }));
    return `<div class="card mini"><h3>${name}</h3><div class="sub">${esc(F.held_targets?.[b] || '')}</div>${mini(pts, F.boards[b]?.seed_hold, null, Object.keys(idx).length)}</div>`; }).join('');
  const charts = `<section class="block"><h2>Dev score per cycle (what the agents see)</h2>${legend}<div class="grid3">${devCharts}</div></section>
     <section class="block"><h2>Private held-out score per cycle (humans only, never shown to agents)</h2><div class="grid3">${holdCharts}</div></section>`;
  const hcell = c => c.held_status === 'ok' ? `${f(c.held)} ${c.held_parent != null ? sgn(c.held - c.held_parent) : ''}`
    : c.held_status === 'scoring' ? '<span class="dim">scoring…</span>' : c.held_status === 'none' ? '<span class="dim">none (T3)</span>'
    : c.held_status === 'error' ? `<span class="neg" data-tip="${esc(c.held_error || '')}">error</span>` : '<span class="dim">–</span>';
  const ctab = `<section class="block"><h2>Every cycle: dev and private held-out score (Δ vs its parent)</h2><div class="card wrap" style="max-height:520px;overflow:auto"><table>
     <tr><th>Cycle</th><th>Board</th><th>Model</th><th>Verdict</th><th>Dev (Δ parent)</th><th>Held-out (Δ parent)</th><th>Min</th><th>Hypothesis</th></tr>
     ${F.cycles.slice().reverse().map(c => `<tr class="click" onclick="openCycle('${esc(c.id)}')"><td class="mono">${esc(c.id)}</td><td>${esc((B.find(x => x[0] === c.board) || [, c.board])[1])}</td>
       <td><span class="sw" style="background:${mcol(c.researcher)}"></span>${esc(mname(c.researcher))}${c.substitute ? ` <span class="dim">(for ${esc(mname(c.intended))})</span>` : ''}</td>
       <td>${tag(c.verdict)}</td><td>${f(c.dev)} ${c.parent_dev != null && c.dev != null ? sgn(c.dev - c.parent_dev) : ''}</td><td>${hcell(c)}</td>
       <td>${f(c.minutes, 0)}</td><td class="dim" style="max-width:420px">${esc((c.title || '').slice(0, 120))}</td></tr>`).join('') || '<tr><td colspan="8" class="dim">no finished cycles yet</td></tr>'}</table></div></section>`;
  const rrow = F.researchers.map(r => `<tr><td><span class="sw" style="background:${mcol(r.model)}"></span>${esc(mname(r.model))}</td><td>${r.n}</td><td>${r.accepted}</td>
     <td>${r.rate == null ? '–' : (100 * r.rate).toFixed(0) + '%'} <span class="dim">[${r.lo == null ? '–' : (100 * r.lo).toFixed(0)}–${r.hi == null ? '–' : (100 * r.hi).toFixed(0)}%]</span>
       <span class="ci"><i style="left:${100 * (r.lo || 0)}%;width:${100 * ((r.hi || 0) - (r.lo || 0))}%"></i><b style="left:${100 * (r.rate || 0)}%;background:${mcol(r.model)}"></b></span></td>
     <td>${sgn(r.mean_gain)}</td><td>${sgn(r.mean_acc_gain)}</td><td>${sgn(r.mean_hold)}</td><td>${f(r.med_min, 0)}</td><td>${r.substitute}</td><td>${r.skipped}</td><td>${r.vetoed}</td></tr>`).join('');
  const gvo = `<section class="block"><h2>Researcher models: GPT-6.2 Sol vs Opus 5.5 vs Gemini 4 Neon (plus quota substitutes)</h2><div class="card wrap"><table>
     <tr><th>Model (ran the cycle)</th><th>Cycles</th><th>Accepted</th><th>Acceptance [95% Wilson]</th><th>Mean dev Δ</th><th>Mean Δ accepted</th><th>Mean held-out Δ (humans)</th><th>Median min</th><th>As substitute</th><th>Skipped/err</th><th>Vetoed</th></tr>
     ${rrow || '<tr><td colspan="11" class="dim">no finished cycles</td></tr>'}</table></div></section>`;
  const prow = F.providers.map(p => `<tr><td><span class="sw" style="background:${mcol(p.cli + ':')}"></span><b>${esc(p.cli)}</b></td>
     <td>${p.limited_until ? `<span class="tag warn">⚠ limited until ${esc(cet(p.limited_until))}</span>` : '<span class="tag ok">✓ available</span>'}</td>
     <td>${p.active}${p.cap ? ' / ' + p.cap : ''}</td><td>${p.calls} <span class="dim">(${p.last24} in 24h)</span></td><td>${p.fails}</td><td>${p.limited}</td><td>${p.served_as_sub}</td>
     <td>${p.mean_s == null ? '–' : f(p.mean_s / 60, 1) + ' min'}</td><td>${ago(p.last)}</td><td class="dim" style="font-size:12px">${esc(p.models.join(', '))}</td></tr>`).join('');
  const quota = `<section class="block"><h2>Providers &amp; quota ${F.claude_week_util != null ? `<span class="pill">Claude 7-day utilisation ${(100 * F.claude_week_util).toFixed(0)}%</span>` : ''}
     <span class="pill">cheap fallback: DeepSeek (opencode) → DeepSeek (cmd) → Sonnet → Luna → Hydrogen</span></h2><div class="card wrap"><table>
     <tr><th>CLI</th><th>Status</th><th>Active / cap</th><th>Calls</th><th>Failed</th><th>Limit hits</th><th>Ran as substitute</th><th>Mean call</th><th>Last call</th><th>Models</th></tr>${prow}</table></div></section>`;
  const gap = `<section class="block"><h2>Metric gaps on the public test board · weight × (top-10 mean − our best entry) · snapshot ${esc(Object.values(F.gaps)[0]?.snapshot || '–')}</h2><div class="grid3">${
    B.map(([b, name]) => { const g = F.gaps[LBB[b]]; if (!g) return ''; const mx = Math.max(1e-9, ...g.metrics.map(m => m.gap || 0));
      return `<div class="card"><h3 style="font-size:12px;color:var(--bright);margin-bottom:8px">${name} <span class="dim">· ours ${f(g.ours)} vs top-10 ${f(g.top10)}</span></h3><table>${g.metrics.map(m =>
        `<tr data-tip="${esc(`${m.metric}: top-10 ${f(m.top10)} · ours ${f(m.ours)} · weight ${f(m.weight, 3)}`)}"><td style="width:38%">${esc(m.metric)}</td><td>${(m.gap || 0) > 0 ? `<span class="gapbar" style="width:${Math.max(2, 70 * m.gap / mx)}%"></span>` : ''} ${f(m.gap)}</td></tr>`).join('')}</table></div>`; }).join('')}</div></section>`;
  const crow = F.checkpoints.slice().reverse().map(c => `<tr><td class="mono">${esc(c.stamp)}</td><td>${esc(cet(c.t))}</td><td>${c.ok ? '<span class="tag ok">✓ gates pass</span>' : '<span class="tag bad">✖ failed</span>'}</td>
     <td class="mono" style="font-size:12px">${esc(Object.entries(c.parts || {}).map(([b, id]) => `${b}:${id}`).join('  ') || 'seed (all boards)')}</td></tr>`).join('');
  const fin = F.final || {};
  const exp = `<section class="block"><h2>Exports: automated checkpoints &amp; final submission</h2><div class="grid2"><div class="card wrap"><table><tr><th>Checkpoint</th><th>Time</th><th>Export</th><th>Program per board</th></tr>
     ${crow || '<tr><td colspan="4" class="dim">none yet (every 6 h, and at research end)</td></tr>'}</table></div>
     <div class="card">${fin.submission ? `<p>${fin.submission.ok ? '<span class="tag ok">✓ final submission ready</span>' : '<span class="tag bad">✖ final export failed</span>'} <span class="dim">final/submission · ${esc((fin.evidence || []).join(', '))}</span></p><pre>${esc(fin.summary || '')}</pre>`
       : fin.fallback ? `<p><span class="tag warn">⚠ hard-stop fallback used</span></p><pre>${esc(fin.fallback)}</pre>` : '<div class="dim">Final selection and export run automatically after research stops.</div>'}</div></div></section>`;
  setTimeout(() => tipOn($('p-final')), 0);
  return tiles + alerts + boards + ctab + charts + gvo + quota + gap + exp;
}

async function render() {
  try {
    if (!RUN) await loadRuns(); if (!RUN) { $('p-overview').innerHTML = '<div class="dim">No runs yet.</div>'; return; }
    D = await api('/api/run'); if (!D) return;
    HL = await api('/api/health'); updateBadges();
    $('dot').className = 'dot ' + (D.alive ? 'alive' : 'dead'); $('cycBadge').textContent = D.cycles.length || '';
    const el = $('p-' + PAGE), sc = PAGE === 'logs' ? null : window.scrollY;
    const openDetails = [...el.querySelectorAll('details[open]')].map(x => x.dataset.f);
    let h = '';
    if (PAGE === 'final') h = await finalPage();
    else if (PAGE === 'overview') h = healthStrip(HL) + overview(D); else if (PAGE === 'cycles') h = cyclesTable(D); else if (PAGE === 'live') h = await livePage();
    else if (PAGE === 'best') h = await bestPage(D); else if (PAGE === 'holdout') h = holdoutPage(D); else if (PAGE === 'notebook') h = await notebookPage();
    else if (PAGE === 'fleet') h = await fleetPage(); else if (PAGE === 'activity') h = await activityPage(); else if (PAGE === 'logs') h = await logsPage();
    else if (PAGE === 'limits') h = await limitsPage(); else if (PAGE === 'config') h = configPage(D);
    else if (PAGE === 'tasks') h = await tasksPage(); else if (PAGE === 'tuning') h = await tuningPage();
    if (PAGE === 'logs' && document.activeElement?.id === 'logFilter') { const lb = $('logBox'); if (lb) lb.outerHTML = h.match(/<pre id="logBox"[\s\S]*<\/pre>/)[0]; }
    else el.innerHTML = h;
    if (PAGE === 'overview') $('metricSel').onchange = e => { metric = e.target.value; store.set('metric', metric); render(); };
    if (PAGE === 'logs') { $('logWhich').onchange = e => { LOGW = e.target.value; render(); }; $('logFilter').oninput = e => { LOGF = e.target.value; render(); };
      $('follow').onchange = e => FOLLOW = e.target.checked; if (FOLLOW) { const lb = $('logBox'); lb.scrollTop = lb.scrollHeight; } }
    if (PAGE === 'notebook' && KBV === 'records') { $('kbBoard').onchange = e => { KBF.board = e.target.value; render(); }; $('kbStatus').onchange = e => { KBF.status = e.target.value; render(); };
      $('kbQ').onchange = e => { KBF.q = e.target.value; render(); }; }
    if (PAGE === 'live') { $('liveFollow').onchange = e => LIVEFOLLOW = e.target.checked; if (LIVEFOLLOW) document.querySelectorAll('.livebox').forEach(b => b.scrollTop = b.scrollHeight); }
    if (sc != null) window.scrollTo(0, sc);
    $('refreshInfo').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) { $('refreshInfo').textContent = 'error: ' + e.message; }
}
async function checkHoldout() {
  let r; try { r = await (await fetch('/api/pending')).json(); } catch { return; }
  const b = $('holdoutBanner'), wait = r.pending.filter(p => p.phase === 'awaiting_holdout' && p.status !== 'running');
  const jobs = r.pending.filter(p => p.status);
  b.hidden = !r.pending.length;
  if (!r.pending.length) return;
  $('hbText').textContent = wait.length ? `${wait.length} run(s) finished research and wait for the holdout step` :
    jobs.map(j => `${j.run}: holdout step ${j.status} (log ${j.log})`).join(' · ');
  for (const el of ['hbRun', 'hbCfg', 'hbPass', 'hbGo', 'hbExport']) $(el).hidden = !wait.length;
  const sel = $('hbRun'), cur = sel.value;
  sel.innerHTML = wait.map(p => `<option>${esc(p.run)}</option>`).join(''); if (cur) sel.value = cur;
  if (!$('hbCfg').options.length) $('hbCfg').innerHTML = r.configs.map(c => `<option ${c === 'config.json' ? 'selected' : ''}>${esc(c)}</option>`).join('');
  if (r.locked_out) $('hbMsg').textContent = 'locked for 10 min after 3 wrong passphrases';
  if (wait.length && document.title.indexOf('🔒') < 0) document.title = '🔒 ' + document.title;
  if (!wait.length) document.title = document.title.replace('🔒 ', '');
}
document.addEventListener('DOMContentLoaded', () => {
  $('hbGo').onclick = async () => {
    const pw = $('hbPass').value; if (!pw) return;
    $('hbMsg').textContent = 'checking…';
    const r = await fetch('/api/final', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-MG': '1' },
      body: JSON.stringify({ run: $('hbRun').value, config: $('hbCfg').value, export: $('hbExport').checked, passphrase: pw }) });
    $('hbPass').value = '';
    $('hbMsg').textContent = (await r.json()).message;
    checkHoldout();
  };
  checkHoldout(); setInterval(checkHoldout, 20000);
});
function schedule() { clearInterval(timer); const s = +$('refresh').value; if (s) timer = setInterval(async () => { await loadRuns(); if ($('modal').hidden) render(); }, s * 1000); }
$('refresh').onchange = schedule;
(async () => { await loadRuns(); show(PAGE); schedule(); })();
</script>
</body>
